name: Nightly ratings

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC (6 AM Eastern in summer, 5 AM in winter), after all games are final
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: nightly-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy scipy
      - name: Download new games and rebuild ratings
        run: python update_ratings.py
      - name: Save to the site
        run: |
          git config user.name "hoop-numbers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratings_*.json data/
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Nightly ratings $(date -u +%F)"
          git push
